<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Défi : le partage d'une vidéo</title><style>body{margin:0;background:#0e1930;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.wrap{width:min(920px,95vw);text-align:center}h1{font-size:clamp(24px,4vw,42px)}.scene{background:#172b50;border-radius:22px;padding:24px;min-height:350px}.people{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;justify-items:center;margin:24px auto;max-width:700px}.person{background:#3277e4;border:2px solid #9fc4ff;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;font-size:25px;animation:pop .4s both}@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}.count{font-size:38px;font-weight:bold}.equation{font-size:24px;color:#a7d1ff;margin:12px}button{border:0;border-radius:12px;padding:14px 20px;margin:8px;background:#3b82f6;color:white;font-size:17px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.hint{color:#d4e4ff;line-height:1.5}</style></head><body><main class="wrap"><h1>🎬 Le défi du partage d'une vidéo</h1><p>Chaque personne partage la vidéo avec 2 nouvelles personnes.</p><section class="scene"><h2 id="stage">Départ</h2><div class="people" id="people"></div><div class="count" id="count"></div><div class="equation" id="equation"></div><p class="hint" id="question">Combien de nouvelles personnes recevront la vidéo à la 5e étape ?</p></section><div><button id="prev">← Précédent</button><button id="next">Étape suivante →</button><button id="auto">▶ Lecture automatique</button><button id="reset">↻ Recommencer</button></div><p class="hint">Mathématiques 9e année · Les puissances de 2 · Activité de 15 minutes</p></main><script>let step=0,timer=null;const $=id=>document.getElementById(id);function render(){let n=2**step;$('stage').textContent=step?'Étape '+step:'Départ';$('people').innerHTML=Array.from({length:n},()=>'<span class="person">👤</span>').join('');$('count').textContent=step?n+' nouvelles personnes':'1 personne lance le partage';$('equation').textContent=step?'2^'+step+' = '+n:'Prédisez le résultat !';$('question').textContent=step===5?'Réponse : 32 nouvelles personnes à la 5e étape.':'Chaque personne transmet la vidéo à 2 autres.';$('prev').disabled=step===0;$('next').disabled=step===5}function stop(){clearInterval(timer);timer=null;$('auto').textContent='▶ Lecture automatique'}$('next').onclick=()=>{stop();step=Math.min(5,step+1);render()};$('prev').onclick=()=>{stop();step=Math.max(0,step-1);render()};$('reset').onclick=()=>{stop();step=0;render()};$('auto').onclick=()=>{if(timer){stop();return}step=0;render();$('auto').textContent='⏸ Arrêter';timer=setInterval(()=>{step++;render();if(step===5)stop()},1800)};render();</script></body></html>
